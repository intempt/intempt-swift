name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # R36: the platform decides which variant a person gets. An SDK that derives its own
  # bucket can disagree with the server, and the same person is then served differently
  # depending on the channel they arrive through — silently, because each side is
  # internally consistent. Runs without install so it cannot be skipped.
  bucketing:
    name: Server-only bucketing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No SDK derives buckets locally (R36)
        run: node scripts/check-no-local-bucketing.mjs
        env:
          GUARD_SRC: Sources

  test:
    name: swift test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build
        run: swift build --build-tests
      # Live contract tests skip themselves when these are absent, so a fork
      # without secrets still gets a green suite.
      - name: Test
        env:
          INTEMPT_API_KEY: ${{ secrets.INTEMPT_API_KEY }}
          INTEMPT_ORG_ID: ${{ secrets.INTEMPT_ORG_ID }}
          INTEMPT_PROJECT_ID: ${{ secrets.INTEMPT_PROJECT_ID }}
          INTEMPT_SOURCE_ID: ${{ secrets.INTEMPT_SOURCE_ID }}
        run: swift test --parallel --enable-code-coverage --xunit-output test-results.xml

      # swift test prints no usable total. Its own summary line reads "Test run with 0 tests
      # passed" because swift-testing reports only ITS lane, and the XCTest count never appears in
      # the log at all - so this job was green with no number a reviewer could quote, which is how
      # a suite that stopped collecting reads exactly like one that passed.
      - name: Report the test total
        if: always()
        run: |
          set -euo pipefail
          f=$(ls test-results*.xml 2>/dev/null | head -1 || true)
          if [ -z "$f" ]; then
            echo "::error::no xunit output - the suite did not run"; exit 1
          fi
          python3 - "$f" <<'PY'
          import sys, os, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          t = f = e = sk = 0
          for s in ([r] if r.tag == 'testsuite' else r.iter('testsuite')):
              t  += int(s.get('tests', 0));    f  += int(s.get('failures', 0))
              e  += int(s.get('errors', 0));   sk += int(s.get('skipped', 0))
          print(f"Executed {t} tests, with {f} failures and {e} errors ({sk} skipped)")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as h:
              h.write(f"**swift test** — executed {t}, failures {f}, errors {e}, skipped {sk}\n")
          if t == 0:
              raise SystemExit("::error::the xunit output reports 0 tests")
          PY

      # This repo had no coverage of any kind — not a low number, no number.
      # The mutation gate is a stronger signal than coverage on the fifteen
      # behaviours it plants defects in, and silent about the other ~2,700
      # lines. This says which of those the suite never touches.
      #
      # Reports without gating, on purpose. A floor invented before anyone has
      # seen the real figure is a number pulled from the air, and the first PR
      # it blocks teaches everyone to route around it. Land the floor in a
      # follow-up, set from what this actually reports.
      - name: Coverage
        run: ./scripts/coverage.sh

  compile-matrix:
    name: compile all platforms
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Proves every platform-conditional branch type-checks. A macOS-host
      # `swift test` cannot: all `#if os(iOS)` code is excluded from that build
      # entirely, so UIKit code could be arbitrarily broken and the suite would
      # still be green. This is the gate for audit finding BLOCK-5.
      #
      # `swiftc -typecheck` rather than `xcodebuild`: xcodebuild needs the full
      # platform components (several GB each, downloaded separately), while the
      # SDKs bundled with Xcode are enough to prove the code compiles.
      - name: Type-check every platform
        run: ./scripts/typecheck-platforms.sh
      - name: Type-check the demo app and its UI tests
        run: ./scripts/typecheck-demo.sh

  demo:
    name: demo app + UI tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT pinning Xcode. `xcode-select -s /Applications/Xcode_16.app`
      # was here and it broke this job: that Xcode's iOS runtime is not installed
      # on the current runner image, so xcodebuild reported zero simulator
      # destinations and only a device placeholder asking for iOS 18.0. The
      # default Xcode is the one whose runtime the image actually ships.
      - name: Show toolchain and pick a simulator
        id: sim
        run: |
          xcodebuild -version
          echo "--- available iOS simulators ---"
          xcrun simctl list devices available | grep -A100 -- '-- iOS' | head -20 || true
          # Resolve a concrete UDID rather than naming a device. A hard-coded
          # name is a guess about the image, and it is exactly what failed here.
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next((x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable')),''))")
          if [ -z "$udid" ]; then
            echo "::error::no iOS simulator is available on this runner"
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "using simulator $udid"

      # The ONLY place the SDK actually runs on iOS. Everything else in this
      # workflow type-checks; this executes autocapture, the UIKit swizzles,
      # the background-task assertion and APNs formatting on a real simulator.
      - name: Build and test demo
        env:
          INTEMPT_API_KEY: ${{ secrets.INTEMPT_API_KEY }}
          INTEMPT_ORG_ID: ${{ secrets.INTEMPT_ORG_ID }}
          INTEMPT_PROJECT_ID: ${{ secrets.INTEMPT_PROJECT_ID }}
          INTEMPT_SOURCE_ID: ${{ secrets.INTEMPT_SOURCE_ID }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project IntemptDemo/IntemptDemo.xcodeproj \
            -scheme IntemptDemo \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet

  mutation:
    name: mutation tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Coverage says a line executed; it does not say an assertion would have
      # noticed the line being wrong. Each mutant is a defect this SDK could
      # plausibly ship, and the suite has to go red for every one.
      #
      # This caught a real gap on its first run: the Edit Field / Action choice
      # lived inside `#if canImport(UIKit)`, which `swift test` on macOS excludes
      # entirely, so swapping the two names passed every test.
      - name: Plant defects and require the suite to catch them
        env:
          INTEMPT_API_KEY: ${{ secrets.INTEMPT_API_KEY }}
          INTEMPT_ORG_ID: ${{ secrets.INTEMPT_ORG_ID }}
          INTEMPT_PROJECT_ID: ${{ secrets.INTEMPT_PROJECT_ID }}
          INTEMPT_SOURCE_ID: ${{ secrets.INTEMPT_SOURCE_ID }}
        run: ./scripts/mutation-test.sh

  perf:
    name: init cost
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      # What the SDK costs the app that embeds it. Nothing measured this
      # before, so the audit scored the SDK's runtime cost as zero — not
      # "slow", but never measured.
      #
      # Deliberately NOT --parallel, and a job of its own. `swift test
      # --parallel` runs bundles concurrently, and a wall-clock number taken
      # while other suites compete for the same cores measures the scheduler,
      # not the SDK. The tests skip themselves unless INTEMPT_PERF=1, so they
      # cost the main `test` job nothing.
      - name: Measure initialize and track
        env:
          INTEMPT_PERF: "1"
        run: swift test --filter InitPerformanceTests
    # NOTE: the assertion in this job is a catastrophe tripwire (250 ms mean
    # cold init), not a budget. Once a few runs have reported real figures,
    # tighten it to something derived from them — see the file comment in
    # Tests/IntemptTests/InitPerformanceTests.swift.

  lint:
    name: format + secrets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version sources agree
        run: ./scripts/check-version-sync.sh

      # The contract is a description and nothing enforced it. A rename here
      # does not break a Swift build — it breaks the React Native bridge at
      # runtime, on someone else's machine, later.
      - name: Public surface matches the contract
        run: ./scripts/check-contract-conformance.sh

      - name: swift-format
        run: swift format lint --recursive --strict Sources Tests
      - name: gitleaks
        # The binary, not gitleaks/gitleaks-action@v2. That action refuses to run
        # for an organization without a paid licence — "[intempt] is an
        # organization. License key is required." — so it failed on every run
        # here without ever scanning anything.
        #
        # The other Intempt repos run the same scanner from its Docker image
        # (see destinations-processor/.github/workflows/security.yaml). Docker is
        # not available on macOS runners, so this installs the binary instead and
        # keeps the flags identical: full history, redacted output, non-zero exit
        # on any finding.
        run: |
          brew install gitleaks
          gitleaks git . --redact --verbose --exit-code 1

  podspec:
    name: podspec lints
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Validates the spec CocoaPods will actually resolve, against the real
      # tag on the real remote — not a local copy. This is what `pod trunk push`
      # runs before accepting a release, so a failure here is a release that
      # would have been rejected.
      #
      # --allow-warnings: the spec is warning-clean today, but a warning is not
      # worth failing a release over. An error is.
      #
      # Which linter depends on whether the tag exists yet, and it has to:
      # `pod spec lint` clones the REMOTE at s.source[:tag], so on a version-bump
      # PR it fails with "Remote branch v0.1.1 not found in upstream origin" —
      # the tag cannot exist yet, because tags are cut from main after the bump
      # merges. Running spec lint unconditionally makes every release PR red for
      # a reason that is not a defect.
      #
      # `pod lib lint` validates the same spec against the local working tree
      # instead, which is exactly what is wanted before the tag exists. Once it
      # does exist, spec lint is the stronger check — it proves what CocoaPods
      # will actually resolve — so keep using it. This is the same split
      # mixpanel-swift makes in its release workflow, for the same reason.
      - name: pod lint
        run: |
          version=$(grep -E "^\s*s\.version\s*=" Intempt.podspec | sed -E "s/.*'([^']+)'.*/\1/")
          if git ls-remote --tags --exit-code origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "tag v$version exists — validating what CocoaPods will resolve"
            pod spec lint Intempt.podspec --allow-warnings
          else
            echo "tag v$version does not exist yet — validating the working tree"
            echo "(spec lint runs on main once the tag is cut; see docs/RELEASING.md)"
            pod lib lint Intempt.podspec --allow-warnings
          fi

  license:
    name: attribution present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Apache 2.0 §4(b) requires the modification notices, and §4(d) requires
      # NOTICE to travel with the distribution. A file that loses its
      # attribution header in a refactor is a license violation, so it fails CI.
      - name: LICENSE and NOTICE exist
        run: |
          test -s LICENSE || { echo "LICENSE missing"; exit 1; }
          test -s NOTICE  || { echo "NOTICE missing"; exit 1; }
          grep -q "Apache License" LICENSE
          grep -q "Mixpanel" NOTICE
      # A file is a DERIVED WORK if and only if it carries a Mixpanel
      # copyright line. Several files merely mention mixpanel-swift in prose to
      # record that no upstream equivalent exists — those are original work and
      # need no attribution. Keying on the prose mention instead flagged six
      # original files and would have trained everyone to ignore this job.
      - name: Derived files retain their attribution and are listed in NOTICE
        run: |
          fail=0
          derived=$(grep -rl "Copyright © .*Mixpanel" Sources --include='*.swift')
          if [ -z "$derived" ]; then echo "no derived files found — check the pattern"; exit 1; fi
          for f in $derived; do
            grep -q "Apache License, Version 2.0" "$f" || { echo "no license line: $f"; fail=1; }
            grep -q "$(basename "$f")" NOTICE || { echo "not listed in NOTICE: $f"; fail=1; }
          done
          echo "$(echo "$derived" | wc -l | tr -d ' ') derived file(s) checked"
          exit $fail
      # A NOTICE crediting code we do not ship is as wrong as one omitting code
      # we do. This caught a stale GzipSwift credit after compression was cut.
      - name: NOTICE lists no files that were removed
        run: |
          fail=0
          for p in $(grep -oE 'Sources/Intempt/[A-Za-z+]+\.swift' NOTICE | sort -u); do
            test -f "$p" || { echo "NOTICE credits a file that does not exist: $p"; fail=1; }
          done
          exit $fail

  all-green:
    name: all-green
    runs-on: ubuntu-latest
    needs: [test, compile-matrix, demo, lint, license, podspec, mutation, perf]
    if: always()
    steps:
      # Branch protection points at this single job, so adding a job above
      # cannot be silently un-gated by forgetting to add it to the ruleset.
      - name: Verify every job succeeded
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"' && exit 1
          echo '${{ toJSON(needs) }}' | grep -q '"result": "cancelled"' && exit 1
          exit 0
