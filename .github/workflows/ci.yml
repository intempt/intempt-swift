name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build
        run: swift build --build-tests
      # Live contract tests skip themselves when these are absent, so a fork
      # without secrets still gets a green suite.
      - name: Test
        env:
          INTEMPT_API_KEY: ${{ secrets.INTEMPT_API_KEY }}
          INTEMPT_ORG_ID: ${{ secrets.INTEMPT_ORG_ID }}
          INTEMPT_PROJECT_ID: ${{ secrets.INTEMPT_PROJECT_ID }}
          INTEMPT_SOURCE_ID: ${{ secrets.INTEMPT_SOURCE_ID }}
        run: swift test --parallel

  compile-matrix:
    name: compile all platforms
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Proves every platform-conditional branch type-checks. A macOS-host
      # `swift test` cannot: all `#if os(iOS)` code is excluded from that build
      # entirely, so UIKit code could be arbitrarily broken and the suite would
      # still be green. This is the gate for audit finding BLOCK-5.
      #
      # `swiftc -typecheck` rather than `xcodebuild`: xcodebuild needs the full
      # platform components (several GB each, downloaded separately), while the
      # SDKs bundled with Xcode are enough to prove the code compiles.
      - name: Type-check every platform
        run: ./scripts/typecheck-platforms.sh
      - name: Type-check the demo app and its UI tests
        run: ./scripts/typecheck-demo.sh

  demo:
    name: demo app + UI tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      # The ONLY place the SDK actually runs on iOS. Everything else in this
      # workflow type-checks; this executes autocapture, the UIKit swizzles,
      # the background-task assertion and APNs formatting on a real simulator.
      - name: Build and test demo
        env:
          INTEMPT_API_KEY: ${{ secrets.INTEMPT_API_KEY }}
          INTEMPT_ORG_ID: ${{ secrets.INTEMPT_ORG_ID }}
          INTEMPT_PROJECT_ID: ${{ secrets.INTEMPT_PROJECT_ID }}
          INTEMPT_SOURCE_ID: ${{ secrets.INTEMPT_SOURCE_ID }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project IntemptDemo/IntemptDemo.xcodeproj \
            -scheme IntemptDemo \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet

  lint:
    name: format + secrets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: swift-format
        run: swift format lint --recursive --strict Sources Tests
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license:
    name: attribution present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Apache 2.0 §4(b) requires the modification notices, and §4(d) requires
      # NOTICE to travel with the distribution. A file that loses its
      # attribution header in a refactor is a license violation, so it fails CI.
      - name: LICENSE and NOTICE exist
        run: |
          test -s LICENSE || { echo "LICENSE missing"; exit 1; }
          test -s NOTICE  || { echo "NOTICE missing"; exit 1; }
          grep -q "Apache License" LICENSE
          grep -q "Mixpanel" NOTICE
      # A file is a DERIVED WORK if and only if it carries a Mixpanel
      # copyright line. Several files merely mention mixpanel-swift in prose to
      # record that no upstream equivalent exists — those are original work and
      # need no attribution. Keying on the prose mention instead flagged six
      # original files and would have trained everyone to ignore this job.
      - name: Derived files retain their attribution and are listed in NOTICE
        run: |
          fail=0
          derived=$(grep -rl "Copyright © .*Mixpanel" Sources --include='*.swift')
          if [ -z "$derived" ]; then echo "no derived files found — check the pattern"; exit 1; fi
          for f in $derived; do
            grep -q "Apache License, Version 2.0" "$f" || { echo "no license line: $f"; fail=1; }
            grep -q "$(basename "$f")" NOTICE || { echo "not listed in NOTICE: $f"; fail=1; }
          done
          echo "$(echo "$derived" | wc -l | tr -d ' ') derived file(s) checked"
          exit $fail
      # A NOTICE crediting code we do not ship is as wrong as one omitting code
      # we do. This caught a stale GzipSwift credit after compression was cut.
      - name: NOTICE lists no files that were removed
        run: |
          fail=0
          for p in $(grep -oE 'Sources/Intempt/[A-Za-z+]+\.swift' NOTICE | sort -u); do
            test -f "$p" || { echo "NOTICE credits a file that does not exist: $p"; fail=1; }
          done
          exit $fail

  all-green:
    name: all-green
    runs-on: ubuntu-latest
    needs: [test, compile-matrix, demo, lint, license]
    if: always()
    steps:
      # Branch protection points at this single job, so adding a job above
      # cannot be silently un-gated by forgetting to add it to the ruleset.
      - name: Verify every job succeeded
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"' && exit 1
          echo '${{ toJSON(needs) }}' | grep -q '"result": "cancelled"' && exit 1
          exit 0
